<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Spliteet mark: three whole bands (slice) beside a finer tile grid (grid). -->
  <style>
    .ink { fill: #101012 }
    .tile { fill: #8FB420 }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #EDEDE8 }
      .tile { fill: #D8FB51 }
    }
  </style>
  <g class="ink">
    <rect x="3.2" y="4" width="12" height="6.5" rx="1.4"/>
    <rect x="3.2" y="12.75" width="12" height="6.5" rx="1.4"/>
    <rect x="3.2" y="21.5" width="12" height="6.5" rx="1.4"/>
  </g>
  <g class="tile">
    <rect x="17.2" y="4" width="5.1" height="5.1" rx="1.15"/>
    <rect x="23.5" y="4" width="5.1" height="5.1" rx="1.15"/>
    <rect x="17.2" y="10.3" width="5.1" height="5.1" rx="1.15"/>
    <rect x="23.5" y="10.3" width="5.1" height="5.1" rx="1.15"/>
    <rect x="17.2" y="16.6" width="5.1" height="5.1" rx="1.15"/>
    <rect x="23.5" y="16.6" width="5.1" height="5.1" rx="1.15"/>
    <rect x="17.2" y="22.9" width="5.1" height="5.1" rx="1.15"/>
    <rect x="23.5" y="22.9" width="5.1" height="5.1" rx="1.15"/>
  </g>
</svg>
